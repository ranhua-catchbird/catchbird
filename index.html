<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1A1A2E">
    <title>鸟灵大师 - BirdMon</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== 加载画面 ========== -->
<div id="loading-screen" class="loading-screen">
    <div class="loading-content">
        <div class="loading-bird">🐦</div>
        <h1 class="loading-title">鸟灵大师</h1>
        <p class="loading-sub">BirdMon Master</p>
        <div class="loading-bar"><div class="loading-fill"></div></div>
        <p class="loading-tip" id="loading-tip">正在唤醒鸟灵...</p>
    </div>
</div>

<!-- ========== 初始鸟灵选择 ========== -->
<div class="modal-overlay hidden" id="starter-modal">
    <div class="modal-card starter-card">
        <h3 style="margin-bottom:4px">🥚 选择你的初始鸟灵</h3>
        <p style="font-size:12px;color:var(--text2);margin-bottom:14px">它将陪伴你踏上旅程</p>
        <div class="starter-list" id="starter-list"></div>
    </div>
</div>

<!-- ========== 主菜单 ========== -->
<div id="main-menu-screen" class="screen hidden">
    <div class="menu-bg"></div>
    <div class="menu-content">
        <div class="game-title-wrap">
            <span class="title-icon">🐦</span>
            <span class="title-text">鸟灵大师</span>
        </div>
        <p class="game-subtitle">拍照识鸟 · 捕捉对战</p>
        <div class="menu-buttons">
            <button class="menu-btn primary" onclick="game.go('capture')">
                <span class="btn-emoji">📸</span><span>拍照捉鸟</span>
            </button>
            <button class="menu-btn" onclick="game.go('team')">
                <span class="btn-emoji">⚔️</span><span>我的队伍</span>
                <span class="badge" id="team-badge">0/6</span>
            </button>
            <button class="menu-btn" onclick="game.go('battle-menu')">
                <span class="btn-emoji">🏟️</span><span>开始对战</span>
            </button>
            <button class="menu-btn" onclick="game.go('pokedex')">
                <span class="btn-emoji">📖</span><span>鸟灵图鉴</span>
            </button>
            <button class="menu-btn" onclick="game.go('bag')">
                <span class="btn-emoji">🎒</span><span>道具背包</span>
            </button>
            <button class="menu-btn ghost" onclick="game.go('settings')">
                <span class="btn-emoji">⚙️</span><span>设置</span>
            </button>
        </div>
        <div class="player-bar">
            <span class="player-avatar">🧑</span>
            <span class="player-name" id="player-name">训练师</span>
            <span class="player-stat">🏆 <span id="win-count">0</span></span>
            <span class="player-stat">📸 <span id="capture-count">0</span></span>
        </div>
    </div>
</div>

<!-- ========== 捕捉画面 ========== -->
<div id="capture-screen" class="screen hidden">
    <div class="screen-header">
        <button class="back-btn" onclick="game.go('main-menu')">← 返回</button>
        <h2>📸 拍照捉鸟</h2>
        <span class="header-tip" id="capture-boost-indicator"></span>
    </div>
    <div class="capture-body">
        <div class="capture-tip-box">
            <p>📷 拍一张鸟的照片或上传图片<br><small>AI 将识别并帮你捕捉它！</small></p>
        </div>
        <div class="upload-card" id="upload-card" onclick="game.triggerUpload()">
            <input type="file" id="image-input" accept="image/*" capture="environment" hidden>
            <div class="upload-placeholder" id="upload-placeholder">
                <div class="upload-emoji">📷</div>
                <p class="upload-title">点击拍照 / 上传图片</p>
                <p class="upload-hint">支持 JPG / PNG · 最大 5MB</p>
            </div>
            <div class="upload-preview hidden" id="upload-preview">
                <img id="preview-img" alt="预览">
                <div class="preview-actions">
                    <button class="btn-small" onclick="event.stopPropagation();game.retake()">🔄 重拍</button>
                    <button class="btn-small primary" onclick="event.stopPropagation();game.identifyBird()">🔍 AI 识别</button>
                </div>
            </div>
        </div>
        <div class="capture-result hidden" id="capture-result"></div>
        <div class="history-section">
            <h3>📜 最近识别</h3>
            <div class="history-list" id="history-list">
                <p class="empty-hint">还没有识别记录，快去拍第一张吧！</p>
            </div>
        </div>
    </div>
</div>

<!-- ========== 队伍画面 ========== -->
<div id="team-screen" class="screen hidden">
    <div class="screen-header">
        <button class="back-btn" onclick="game.go('main-menu')">← 返回</button>
        <h2>⚔️ 我的队伍</h2>
        <span class="header-tip" id="team-hp-summary"></span>
    </div>
    <div class
